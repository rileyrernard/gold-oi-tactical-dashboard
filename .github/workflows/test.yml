name: Python renderer and installer
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -X utf8 -m pip install -r skills/gold-oi-tactical-dashboard/requirements.txt
      - run: python -X utf8 -m pip check
      - run: python -X utf8 skills/gold-oi-tactical-dashboard/scripts/test_render_dashboard.py
      - run: python -X utf8 -m unittest discover -s tests -v
